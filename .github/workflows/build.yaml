name: Can't keep up with you mind

on:
  schedule:
    - cron: "0 */4 * * *"
  push:
  workflow_dispatch:
jobs:
  build:
    name: Build this site and fuck Hugehard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Node.js
        uses: actions/setup-node@main
        with:
          node-version: latest

      - name: Set up pnpm
        uses: pnpm/action-setup@master

      - name: Refresh jsDelivr cache
        shell: bash
        run: |
          urls=$(grep -oE 'https://cdn[^" ]*jsdelivr\.net/gh/[^" ]+' src/content.config.ts | sort -u)
          if [ -z "$urls" ]; then
            echo "No jsDelivr URLs found."
            exit 0
          fi
          for url in $urls; do
            purge="${url/cdn./purge.}"
            echo "Purging $purge"
            curl -fsS --max-time 3 "$purge" >/dev/null
          done

      - name: Build!
        shell: bash
        run: |
          pnpm install
          pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=867678-xyz
